services:
  postgres:
    image: "${ESA_TEST_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16.4-alpine}"
    environment:
      POSTGRES_USER: esa_test
      POSTGRES_PASSWORD: esa_test_local
      POSTGRES_DB: esa_realworld
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esa_test -d esa_realworld"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: "${ESA_TEST_MONGO_IMAGE:-public.ecr.aws/docker/library/mongo:7.0.14}"
    ports:
      - "127.0.0.1::27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
